name: Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04 # ubuntu-latest is 26.04, which has no prebuilt Ruby 3.0/3.1
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.3']
        gemfile:
          - gemfiles/as6.1_mongoid7.4.gemfile
          - gemfiles/as7.0_mongoid7.4.gemfile
        include:
          - { ruby: '3.0', gemfile: gemfiles/as6.1_mongoid8.1.gemfile }
          - { ruby: '3.0', gemfile: gemfiles/as7.0_mongoid8.1.gemfile }
          - { ruby: '3.3', gemfile: gemfiles/as6.1_mongoid8.1.gemfile }
          - { ruby: '3.3', gemfile: gemfiles/as7.0_mongoid8.1.gemfile }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017/tcp
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: RSpec
        run: bundle exec rspec
        env:
          MONGO_HOST: localhost:${{ job.services.mongo.ports[27017] }}
