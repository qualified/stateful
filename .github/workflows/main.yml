name: Test
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1', '3.3']
        gemfile:
          - gemfiles/as6.1_mongoid7.4.gemfile
          - gemfiles/as7.0_mongoid7.4.gemfile
        experimental: [false]
        include:
          # Mongoid 8.1 after-save dirty tracking is fixed in QUAL-2685.
          - { ruby: '3.0', gemfile: gemfiles/as6.1_mongoid8.1.gemfile, experimental: true }
          - { ruby: '3.0', gemfile: gemfiles/as7.0_mongoid8.1.gemfile, experimental: true }
          - { ruby: '3.3', gemfile: gemfiles/as6.1_mongoid8.1.gemfile, experimental: true }
          - { ruby: '3.3', gemfile: gemfiles/as7.0_mongoid8.1.gemfile, experimental: true }
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/${{ matrix.gemfile }}
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017/tcp
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: RSpec
        run: bundle exec rspec
        env:
          MONGO_HOST: localhost:${{ job.services.mongo.ports[27017] }}
